name: CI

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['main', 'master']

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint

      - name: Create Next.js types directory
        run: |
          mkdir -p .next/dev/types
          echo "// Generated for CI type checking" > .next/dev/types/routes.d.ts
          echo "export {};" >> .next/dev/types/routes.d.ts

      - name: Run TypeScript type check
        run: yarn lint-ts

      - name: Run Stylelint
        run: yarn lint:css

      - name: Run tests
        run: yarn test

      # Codegen is intentionally not run here: it introspects the live Shopify
      # schema (which needs secrets) and the generated SDK is committed.
      # Vercel regenerates it during `yarn build`.
