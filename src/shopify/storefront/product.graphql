query getProductByHandle(
  $handle: String
  $language: LanguageCode
  $identifiers: [HasMetafieldsIdentifier!]!
) @inContext(language: $language) {
  product(handle: $handle) {
    ...ProductFields
  }
}

query productRecommendations(
  $productId: ID!
  $language: LanguageCode
  $identifiers: [HasMetafieldsIdentifier!]!
) @inContext(language: $language) {
  productRecommendations(productId: $productId) {
    ...ProductFields
  }
}

query getProducts(
  $first: Int
  $last: Int
  $after: String
  $before: String
  $sortKey: ProductSortKeys
  $query: String
  $language: LanguageCode
  $identifiers: [HasMetafieldsIdentifier!]!
) @inContext(language: $language) {
  products(
    first: $first
    last: $last
    after: $after
    before: $before
    sortKey: $sortKey
    query: $query
  ) {
    pageInfo {
      ...PageInfoFields
    }
    edges {
      cursor
      node {
        ...ProductFields
      }
    }
  }
}

query getProductsByIds(
  $ids: [ID!]!
  $identifiers: [HasMetafieldsIdentifier!]!
  $language: LanguageCode
) @inContext(language: $language) {
  nodes(ids: $ids) {
    ... on Product {
      ...ProductFields
    }
  }
}
