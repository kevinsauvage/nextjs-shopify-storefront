query getCart(
  $cartId: ID!
  $first: Int
  $last: Int
  $after: String
  $before: String
  $language: LanguageCode
) @inContext(language: $language) {
  cart(id: $cartId) {
    ...CartFields
  }
}

query checkoutURL($cartId: ID!, $language: LanguageCode) @inContext(language: $language) {
  cart(id: $cartId) {
    checkoutUrl
  }
}
