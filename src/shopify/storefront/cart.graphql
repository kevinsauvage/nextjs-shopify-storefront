mutation cartAttributesUpdate(
  $attributes: [AttributeInput!]!
  $cartId: ID!
  $first: Int
  $last: Int
  $after: String
  $before: String
  $language: LanguageCode
) @inContext(language: $language) {
  cartAttributesUpdate(attributes: $attributes, cartId: $cartId) {
    cart {
      ...CartFields
    }
    userErrors {
      ...CartUserErrors
    }
    warnings {
      message
    }
  }
}

